# GradeLens Streamlit configuration.
# Light and dark themes share the same hues, stepped for each surface.
# Viewers can switch between them from the app menu (⋮ → Settings).

[server]
maxUploadSize = 50          # MB
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"     # hides developer options (Deploy, rerun menu) from end users

[logger]
level = "info"

[theme]
baseRadius = "medium"
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f9"
textColor = "#0b0b0b"
redColor = "#d03b3b"
greenColor = "#0ca30c"
blueColor = "#2a78d6"
orangeColor = "#eb6834"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
redColor = "#e66767"
greenColor = "#0ca30c"
blueColor = "#3987e5"
orangeColor = "#d95926"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
